
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel - NotepadKita</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #1976d2;

            padding: 30px 20px;

            color: #333;

        }

        .container {

            width: 100%;

            max-width: 900px;

            margin: auto;

        }

        h1 {

            color: white;

            text-align: center;

            margin-bottom: 10px;

        }

        .subtitle {

            color: #e3f2fd;

            text-align: center;

            margin-bottom: 30px;

        }

        .panel {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.2);

        }

        .status {

            display: flex;

            align-items: center;

            gap: 10px;

            background: #e8f5e9;

            color: #2e7d32;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 25px;

            font-weight: bold;

        }

        .dot {

            width: 12px;

            height: 12px;

            background: #2e7d32;

            border-radius: 50%;

        }

        .stats {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }

        .stat {

            background: #f5f9ff;

            border: 1px solid #d7e9ff;

            padding: 20px;

            border-radius: 12px;

            text-align: center;

        }

        .stat-number {

            font-size: 32px;

            font-weight: bold;

            color: #1976d2;

        }

        .stat-label {

            color: #777;

            margin-top: 5px;

        }

        h2 {

            color: #1976d2;

            margin-bottom: 15px;

        }

        .users {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }

        .user {

            display: flex;

            justify-content: space-between;

            align-items: center;

            background: #f7f7f7;

            padding: 15px;

            border-radius: 10px;

        }

        .user-info {

            display: flex;

            align-items: center;

            gap: 12px;

        }

        .user-dot {

            width: 10px;

            height: 10px;

            background: #2e7d32;

            border-radius: 50%;

        }

        .user-name {

            font-weight: bold;

        }

        .user-status {

            color: #2e7d32;

            font-size: 13px;

        }

        .empty {

            background: #f5f5f5;

            padding: 25px;

            border-radius: 10px;

            text-align: center;

            color: #777;

        }

        .refresh {

            width: 100%;

            margin-top: 20px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1976d2;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .refresh:hover {

            background: #125ca8;

        }

        .back {

            display: block;

            text-align: center;

            color: white;

            border: 2px solid white;

            text-decoration: none;

            padding: 13px;

            border-radius: 8px;

            margin-top: 20px;

            font-weight: bold;

        }

        .back:hover {

            background: white;

            color: #1976d2;

        }

        @media (max-width: 600px) {

            .stats {

                grid-template-columns: 1fr;

            }

            .user {

                align-items: flex-start;

                gap: 10px;

            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        🛠️ Admin Panel
    </h1>

    <p class="subtitle">
        Monitor pengguna NotepadKita
    </p>


    <div class="panel">


        <div class="status">

            <span class="dot"></span>

            Sistem Admin Aktif

        </div>


        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="onlineCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Pengguna Online
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="totalCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Total Pengguna
                </div>

            </div>

        </div>


        <h2>
            👥 Pengguna Live
        </h2>


        <div
            id="users"
            class="users"
        >

            <div class="empty">
                Memuat pengguna...
            </div>

        </div>


        <button
            class="refresh"
            onclick="loadUsers()"
        >
            🔄 Refresh
        </button>


    </div>


    <a
        href="index2.html"
        class="back"
    >
        ← Kembali ke Menu
    </a>

</div>


<script>

async function loadUsers() {

    const users =
        document.getElementById(
            "users"
        );

    try {

        const response =
            await fetch(
                "/api/admin/online-users"
            );

        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Gagal mengambil pengguna."
            );

        }


        document.getElementById(
            "onlineCount"
        ).textContent =
            data.onlineCount;


        document.getElementById(
            "totalCount"
        ).textContent =
            data.totalCount;


        if (
            data.users.length === 0
        ) {

            users.innerHTML = `

                <div class="empty">
                    Tidak ada pengguna online.
                </div>

            `;

            return;

        }


        users.innerHTML = "";


        data.users.forEach(user => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "user";


            element.innerHTML = `

                <div class="user-info">

                    <span class="user-dot"></span>

                    <div>

                        <div class="user-name">
                            ${escapeHTML(
                                user.username
                            )}
                        </div>

                        <div class="user-status">
                            Online
                        </div>

                    </div>

                </div>

                <div>
                    🟢
                </div>

            `;


            users.appendChild(
                element
            );

        });


    } catch (error) {

        console.error(error);

        users.innerHTML = `

            <div class="empty">

                Gagal memuat pengguna.

            </div>

        `;

    }

}


function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


// Muat pertama kali

loadUsers();


// Perbarui setiap 10 detik

setInterval(
    loadUsers,
    10000
);

</script>
