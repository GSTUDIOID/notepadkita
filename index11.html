
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secret Vault</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #1976d2;

            padding: 40px 20px;

        }

        .container {

            width: 100%;

            max-width: 800px;

            margin: auto;

            padding-bottom: 100px;

        }

        .title {

            text-align: center;

            color: white;

            font-size: 38px;

            margin-bottom: 25px;

        }

        .back {

            display: inline-block;

            background: white;

            color: #1976d2;

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 8px;

            font-weight: bold;

            margin-bottom: 20px;

        }

        .vault {

            background: white;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.25);

        }

        .vault-title {

            color: #1976d2;

            font-size: 25px;

            margin-bottom: 20px;

            text-align: center;

        }

        .vault-text {

            background: #f5f5f5;

            border: 2px solid #ddd;

            border-radius: 10px;

            padding: 20px;

            min-height: 400px;

            color: #333;

            font-size: 17px;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;

            user-select: text;

        }

        .notice {

            margin-top: 15px;

            text-align: center;

            color: #777;

            font-size: 14px;

        }

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }

            .title {
                font-size: 30px;
            }

            .vault {
                padding: 20px;
            }

            .vault-text {
                min-height: 350px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1 class="title">
        🔐 Secret Vault
    </h1>


    <a
        href="index7.html"
        class="back"
    >
        ← Kembali ke Admin Panel
    </a>


    <div class="vault">


        <h2 class="vault-title">
            🔒 Pesan Rahasia
        </h2>


        <div class="vault-text">
Ini adalah isi Secret Vault.

Tulisan di halaman ini hanya dapat dibaca dan tidak dapat diubah melalui halaman ini.

Kamu bisa mengganti tulisan ini langsung di file index11.html apabila ingin mengubah isinya.
        </div>


        <div class="notice">
            🔒 Mode baca saja
        </div>


    </div>


</div>


</body>

</html>
