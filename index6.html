<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Panel - NotepadKita</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            background: #1976d2;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }

        .login-box {

            width: 100%;

            max-width: 400px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);

            text-align: center;

        }

        .icon {

            font-size: 55px;

            margin-bottom: 15px;

        }

        h1 {

            color: #1976d2;

            margin-bottom: 25px;

        }

        input {

            width: 100%;

            padding: 14px;

            border: 2px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

            margin-bottom: 15px;

        }

        input:focus {

            border-color: #1976d2;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #1976d2;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #125ca8;

        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        #message {

            margin-top: 15px;

            min-height: 20px;

            font-size: 14px;

        }

        .back {

            display: block;

            margin-top: 20px;

            color: #1976d2;

            text-decoration: none;

            font-size: 14px;

        }

    </style>

</head>

<body>


<div class="login-box">

    <div class="icon">
        🔐
    </div>

    <h1>
        Password Panel
    </h1>

    <input
        type="password"
        id="password"
        placeholder="Masukkan password admin"
        autocomplete="off"
    >

    <button
        id="loginButton"
        onclick="login()"
    >
        Login
    </button>

    <div id="message"></div>

    <a
        href="index2.html"
        class="back"
    >
        ← Kembali
    </a>

</div>


<script>


// ======================================
// LOGIN ADMIN KE SERVER
// ======================================

async function login() {

    const password =
        document
            .getElementById("password")
            .value;

    const message =
        document
            .getElementById("message");

    const button =
        document
            .getElementById("loginButton");


    if (!password) {

        message.style.color =
            "#d32f2f";

        message.textContent =
            "Password wajib diisi.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Memeriksa...";

    message.textContent = "";


    try {

        const response =
            await fetch(
                "/api/admin/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        password: password
                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            message.style.color =
                "#d32f2f";

            message.textContent =
                data.message ||
                "Password salah.";

            button.disabled = false;

            button.textContent =
                "Login";

            return;
        }


        // ==================================
        // SIMPAN TOKEN ADMIN
        // ==================================

        localStorage.setItem(
            "notepadkita_admin_token",
            data.adminToken
        );


        message.style.color =
            "#2e7d32";

        message.textContent =
            "Login berhasil!";


        // ==================================
        // MASUK ADMIN PANEL
        // ==================================

        setTimeout(function() {

            window.location.href =
                "index7.html";

        }, 400);


    } catch (error) {

        console.error(error);

        message.style.color =
            "#d32f2f";

        message.textContent =
            "Server tidak dapat dihubungi.";

        button.disabled = false;

        button.textContent =
            "Login";
    }

}


// ======================================
// ENTER
// ======================================

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );


</script>

</body>

</html>
