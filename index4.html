
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NotepadKita - Penyimpanan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1976d2;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
        }

        .back {
            display: inline-block;
            background: white;
            color: #1976d2;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .notes {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .note {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
        }

        .note h2 {
            color: #1976d2;
            margin-top: 0;
            word-break: break-word;
        }

        .content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            color: #333;
        }

        .date {
            color: #777;
            font-size: 13px;
            margin-top: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .edit {
            background: #1976d2;
        }

        .delete {
            background: #e53935;
        }

        .empty,
        .loading,
        .error {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .error {
            color: #d32f2f;
        }

        /* EDITOR */

        #editor {
            display: none;
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
        }

        #editor input,
        #editor textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        #editor textarea {
            min-height: 300px;
            resize: vertical;
        }

        .counter {
            text-align: right;
            color: #666;
            font-size: 13px;
        }

        .save {
            background: #1976d2;
        }

        .cancel {
            background: #777;
        }

        @media (max-width: 600px) {
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💾 Penyimpanan</h1>

    <a href="index2.html" class="back">
        ← Kembali
    </a>

    <div id="notes" class="notes">
        <div class="loading">
            Memuat catatan...
        </div>
    </div>

    <div id="editor">

        <h2>✏️ Edit Catatan</h2>

        <input
            type="text"
            id="editTitle"
            placeholder="Judul"
        >

        <textarea
            id="editContent"
            maxlength="1000"
            placeholder="Isi catatan"
        ></textarea>

        <div class="counter">
            <span id="counter">0</span> / 1000
        </div>

        <div class="buttons">

            <button
                class="save"
                onclick="simpanEdit()">

                💾 Simpan

            </button>

            <button
                class="cancel"
                onclick="tutupEditor()">

                Batal

            </button>

        </div>

    </div>

</div>


<script>

let userToken = null;
let editId = null;


// =====================================
// COOKIE
// =====================================

function getCookie(name) {

    const cookies =
        document.cookie.split(";");

    for (let cookie of cookies) {

        cookie = cookie.trim();

        if (cookie.startsWith(name + "=")) {

            return decodeURIComponent(
                cookie.substring(
                    name.length + 1
                )
            );

        }

    }

    return null;
}


function setCookie(name, value) {

    document.cookie =
        name +
        "=" +
        encodeURIComponent(value) +
        "; max-age=315360000; path=/; SameSite=Lax";

}


// =====================================
// SIAPKAN USER
// =====================================

async function siapkanUser() {

    userToken =
        getCookie("notepadkita_user");

    if (userToken) {
        return true;
    }

    const response =
        await fetch("/api/users", {
            method: "POST"
        });

    const data =
        await response.json();

    if (!data.success) {

        throw new Error(
            "Gagal membuat user"
        );

    }

    userToken =
        data.userToken;

    setCookie(
        "notepadkita_user",
        userToken
    );

    return true;
}


// =====================================
// TAMPILKAN CATATAN
// =====================================

async function tampilkanCatatan() {

    const box =
        document.getElementById("notes");

    try {

        await siapkanUser();

        const response =
            await fetch(
                "/api/notes/" +
                encodeURIComponent(userToken)
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Gagal mengambil catatan"
            );

        }

        if (
            !data.notes ||
            data.notes.length === 0
        ) {

            box.innerHTML = `
                <div class="empty">
                    <h2>Belum ada catatan</h2>
                    <p>
                        Buat catatan dari halaman
                        "Buat Catatan".
                    </p>
                </div>
            `;

            return;
        }

        box.innerHTML = "";

        data.notes.forEach(note => {

            const element =
                document.createElement("div");

            element.className = "note";

            element.innerHTML = `

                <h2>
                    ${aman(note.title)}
                </h2>

                <div class="content">
                    ${aman(note.content)}
                </div>

                <div class="date">
                    ${aman(note.updated_at)}
                </div>

                <div class="buttons">

                    <button
                        class="edit"
                        onclick="bukaEdit(${note.id})">

                        ✏️ Edit

                    </button>

                    <button
                        class="delete"
                        onclick="hapus(${note.id})">

                        🗑️ Hapus

                    </button>

                </div>
            `;

            box.appendChild(element);

        });

    } catch (error) {

        console.error(error);

        box.innerHTML = `
            <div class="error">

                <h2>Gagal memuat catatan</h2>

                <p>
                    ${aman(error.message)}
                </p>

            </div>
        `;

    }

}


// =====================================
// BUKA EDIT
// =====================================

async function bukaEdit(id) {

    try {

        const response =
            await fetch(
                "/api/notes/" +
                encodeURIComponent(userToken)
            );

        const data =
            await response.json();

        const note =
            data.notes.find(
                n => n.id === id
            );

        if (!note) {

            alert(
                "Catatan tidak ditemukan."
            );

            return;
        }

        editId = id;

        document.getElementById(
            "editTitle"
        ).value = note.title;

        document.getElementById(
            "editContent"
        ).value = note.content;

        updateCounter();

        document.getElementById(
            "editor"
        ).style.display = "block";

        document.getElementById(
            "editor"
        ).scrollIntoView({
            behavior: "smooth"
        });

    } catch (error) {

        alert(
            "Gagal membuka catatan."
        );

    }

}


// =====================================
// COUNTER
// =====================================

document.getElementById(
    "editContent"
).addEventListener(
    "input",
    updateCounter
);


function updateCounter() {

    const value =
        document.getElementById(
            "editContent"
        ).value;

    document.getElementById(
        "counter"
    ).textContent =
        value.length;

}


// =====================================
// SIMPAN EDIT
// =====================================

async function simpanEdit() {

    if (!editId) {
        return;
    }

    const title =
        document.getElementById(
            "editTitle"
        ).value.trim();

    const content =
        document.getElementById(
            "editContent"
        ).value;

    if (!content.trim()) {

        alert(
            "Isi catatan tidak boleh kosong."
        );

        return;
    }

    if (content.length > 1000) {

        alert(
            "Maksimal 1000 karakter."
        );

        return;
    }

    try {

        const response =
            await fetch(
                "/api/notes/" + editId,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        userToken:
                            userToken,

                        title:
                            title ||
                            "Tanpa Judul",

                        content:
                            content

                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Gagal menyimpan."
            );

        }

        alert(
            "Catatan berhasil diperbarui."
        );

        tutupEditor();

        tampilkanCatatan();

    } catch (error) {

        alert(
            error.message
        );

    }

}


// =====================================
// TUTUP EDITOR
// =====================================

function tutupEditor() {

    document.getElementById(
        "editor"
    ).style.display = "none";

    editId = null;

}


// =====================================
// HAPUS
// =====================================

async function hapus(id) {

    if (
        !confirm(
            "Hapus catatan ini?"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/notes/" + id,
                {
                    method: "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        userToken:
                            userToken

                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Gagal menghapus."
            );

        }

        alert(
            "Catatan berhasil dihapus."
        );

        tampilkanCatatan();

    } catch (error) {

        alert(
            error.message
        );

    }

}


// =====================================
// AMANKAN HTML
// =====================================

function aman(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


// =====================================
// MULAI
// =====================================

tampilkanCatatan();

</script>
