<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NotepadKita - Penyimpanan</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1976d2;
            min-height: 100vh;
            padding: 30px 15px;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
        }

        .back {
            display: inline-block;
            background: white;
            color: #1976d2;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .2);
            min-width: 0;
        }

        .panel h2 {
            margin-bottom: 15px;
        }

        .catatan-title {
            color: #1976d2;
        }

        .jurnal-title {
            color: #7b1fa2;
        }

        .create {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .create-catatan {
            background: #1976d2;
        }

        .create-jurnal {
            background: #7b1fa2;
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
        }

        .notes-list::-webkit-scrollbar {
            width: 8px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #aaa;
            border-radius: 10px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #eee;
            border-radius: 10px;
        }

        .note {
            background: #f8f8f8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .note:last-child {
            margin-bottom: 5px;
        }

        .note h3 {
            word-break: break-word;
            margin-bottom: 8px;
        }

        .note-content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            color: #333;
        }

        .date {
            color: #777;
            font-size: 12px;
            margin-top: 10px;
        }

        .type-label {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .type-catatan {
            background: #e3f2fd;
            color: #1976d2;
        }

        .type-jurnal {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .edit {
            background: #1976d2;
        }

        .delete {
            background: #e53935;
        }

        .empty,
        .loading,
        .error {
            background: #f8f8f8;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .error {
            color: #d32f2f;
        }

        #editor {
            display: none;
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
        }

        #editor h2 {
            margin-bottom: 15px;
        }

        #editor input,
        #editor textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        #editor textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.6;
        }

        .counter {
            text-align: right;
            color: #666;
            font-size: 13px;
            margin-top: -5px;
        }

        .save {
            background: #1976d2;
        }

        .cancel {
            background: #777;
        }

        @media (max-width: 700px) {

            body {
                padding: 20px 10px;
            }

            .columns {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            .notes-list {
                max-height: 400px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>💾 Penyimpanan</h1>

    <a href="index2.html" class="back">
        ← Kembali
    </a>

    <div class="columns">

        <!-- ============================== -->
        <!-- CATATAN -->
        <!-- ============================== -->

        <div class="panel">

            <h2 class="catatan-title">
                📝 CATATAN
            </h2>

            <button
                class="create create-catatan"
                onclick="location.href='index3.html'"
            >
                + Buat Catatan
            </button>

            <div
                id="catatanList"
                class="notes-list"
            >

                <div class="loading">
                    Memuat catatan...
                </div>

            </div>

        </div>


        <!-- ============================== -->
        <!-- JURNAL -->
        <!-- ============================== -->

        <div class="panel">

            <h2 class="jurnal-title">
                📖 JURNAL
            </h2>

            <button
                class="create create-jurnal"
                onclick="location.href='index8.html'"
            >
                + Buat Jurnal
            </button>

            <div
                id="jurnalList"
                class="notes-list"
            >

                <div class="loading">
                    Memuat jurnal...
                </div>

            </div>

        </div>

    </div>


    <!-- ============================== -->
    <!-- EDITOR -->
    <!-- ============================== -->

    <div id="editor">

        <h2 id="editorTitle">
            ✏️ Edit
        </h2>

        <input
            type="text"
            id="editTitle"
            placeholder="Judul"
        >

        <textarea
            id="editContent"
            maxlength="5000"
            placeholder="Isi"
        ></textarea>

        <div class="counter">

            <span id="counter">0</span>
            / 5000

        </div>

        <div class="buttons">

            <button
                class="save"
                id="saveEditButton"
            >
                💾 Simpan
            </button>

            <button
                class="cancel"
                id="cancelEditButton"
            >
                Batal
            </button>

        </div>

    </div>

</div>


<script>

let userToken = null;

let editId = null;

let semuaNotes = [];

let editType = null;


// =================================================
// COOKIE
// =================================================

function getCookie(name) {

    const cookies =
        document.cookie.split(";");

    for (
        let cookie of cookies
    ) {

        cookie = cookie.trim();

        if (
            cookie.startsWith(
                name + "="
            )
        ) {

            return decodeURIComponent(
                cookie.substring(
                    name.length + 1
                )
            );

        }

    }

    return null;

}


function setCookie(
    name,
    value
) {

    document.cookie =
        name +
        "=" +
        encodeURIComponent(value) +
        "; max-age=315360000; path=/; SameSite=Lax";

}


// =================================================
// SIAPKAN USER
// =================================================

async function siapkanUser() {

    userToken =
        getCookie(
            "notepadkita_user"
        );

    if (userToken) {
        return true;
    }

    try {

        const response =
            await fetch(
                "/api/users",
                {
                    method: "POST"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Gagal membuat pengguna."
            );

        }

        const data =
            await response.json();

        if (
            !data.success ||
            !data.userToken
        ) {

            throw new Error(
                data.message ||
                "User tidak valid."
            );

        }

        userToken =
            data.userToken;

        setCookie(
            "notepadkita_user",
            userToken
        );

        return true;

    } catch (error) {

        console.error(
            error
        );

        return false;

    }

}


// =================================================
// JSON
// =================================================

async function bacaJSON(
    response
) {

    const text =
        await response.text();

    if (!text) {

        throw new Error(
            "Server mengirim response kosong."
        );

    }

    try {

        return JSON.parse(text);

    } catch {

        throw new Error(
            "Server mengirim data yang tidak valid."
        );

    }

}


// =================================================
// AMAN HTML
// =================================================

function aman(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


// =================================================
// TAMPILKAN DATA
// =================================================

async function tampilkanCatatan() {

    const catatanBox =
        document.getElementById(
            "catatanList"
        );

    const jurnalBox =
        document.getElementById(
            "jurnalList"
        );


    catatanBox.innerHTML = `
        <div class="loading">
            Memuat catatan...
        </div>
    `;


    jurnalBox.innerHTML = `
        <div class="loading">
            Memuat jurnal...
        </div>
    `;


    try {

        const siap =
            await siapkanUser();

        if (!siap) {

            throw new Error(
                "Pengguna tidak dapat disiapkan."
            );

        }


        const response =
            await fetch(
                "/api/notes/" +
                encodeURIComponent(
                    userToken
                )
            );


        const data =
            await bacaJSON(
                response
            );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Gagal mengambil data."
            );

        }


        semuaNotes =
            Array.isArray(
                data.notes
            )
                ? data.notes
                : [];


        // =========================================
        // PEMISAHAN WAJIB BERDASARKAN TYPE
        // =========================================

        const catatan =
            semuaNotes.filter(
                note =>
                    note.type ===
                    "catatan"
            );


        const jurnal =
            semuaNotes.filter(
                note =>
                    note.type ===
                    "jurnal"
            );


        tampilkanDaftar(
            catatanBox,
            catatan,
            "catatan"
        );


        tampilkanDaftar(
            jurnalBox,
            jurnal,
            "jurnal"
        );


    } catch (error) {

        console.error(
            error
        );


        catatanBox.innerHTML = `
            <div class="error">

                <h3>
                    Gagal memuat catatan
                </h3>

                <p>
                    ${aman(
                        error.message
                    )}
                </p>

            </div>
        `;


        jurnalBox.innerHTML = `
            <div class="error">

                <h3>
                    Gagal memuat jurnal
                </h3>

                <p>
                    ${aman(
                        error.message
                    )}
                </p>

            </div>
        `;

    }

}


// =================================================
// TAMPILKAN LIST
// =================================================

function tampilkanDaftar(
    box,
    notes,
    type
) {

    if (
        notes.length === 0
    ) {

        box.innerHTML = `

            <div class="empty">

                <h3>
                    ${
                        type === "jurnal"
                            ? "Belum ada jurnal"
                            : "Belum ada catatan"
                    }
                </h3>

                <p>
                    ${
                        type === "jurnal"
                            ? "Buat jurnal baru."
                            : "Buat catatan baru."
                    }
                </p>

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    notes.forEach(
        function(note) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "note";


            const label =
                type === "jurnal"
                    ? "📖 JURNAL"
                    : "📝 CATATAN";


            const labelClass =
                type === "jurnal"
                    ? "type-jurnal"
                    : "type-catatan";


            element.innerHTML = `

                <div
                    class="type-label ${labelClass}"
                >
                    ${label}
                </div>

                <h3>
                    ${aman(
                        note.title ||
                        (
                            type === "jurnal"
                                ? "Jurnal Tanpa Judul"
                                : "Tanpa Judul"
                        )
                    )}
                </h3>

                <div class="note-content">
                    ${aman(
                        note.content
                    )}
                </div>

                <div class="date">
                    Terakhir diperbarui:
                    ${aman(
                        note.updated_at ||
                        note.created_at ||
                        ""
                    )}
                </div>

                <div class="buttons">

                    <button
                        class="edit"
                        onclick="bukaEdit(${note.id})"
                    >
                        ✏️ Edit
                    </button>

                    <button
                        class="delete"
                        onclick="hapus(${note.id})"
                    >
                        🗑️ Hapus
                    </button>

                </div>

            `;


            box.appendChild(
                element
            );

        }
    );

}


// =================================================
// EDIT
// =================================================

function bukaEdit(id) {

    const note =
        semuaNotes.find(
            n => n.id === id
        );


    if (!note) {

        alert(
            "Data tidak ditemukan."
        );

        return;

    }


    editId =
        id;

    editType =
        note.type;


    document.getElementById(
        "editTitle"
    ).value =
        note.title || "";


    document.getElementById(
        "editContent"
    ).value =
        note.content || "";


    document.getElementById(
        "editorTitle"
    ).textContent =
        note.type === "jurnal"
            ? "✏️ Edit Jurnal"
            : "✏️ Edit Catatan";


    updateCounter();


    document.getElementById(
        "editor"
    ).style.display =
        "block";


    document.getElementById(
        "editor"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


// =================================================
// COUNTER
// =================================================

document.getElementById(
    "editContent"
).addEventListener(
    "input",
    updateCounter
);


function updateCounter() {

    const value =
        document.getElementById(
            "editContent"
        ).value;


    document.getElementById(
        "counter"
    ).textContent =
        value.length;

}


// =================================================
// SIMPAN EDIT
// =================================================

async function simpanEdit() {

    if (!editId) {
        return;
    }


    const title =
        document.getElementById(
            "editTitle"
        ).value.trim();


    const content =
        document.getElementById(
            "editContent"
        ).value;


    if (!content.trim()) {

        alert(
            "Isi tidak boleh kosong."
        );

        return;

    }


    if (
        content.length > 5000
    ) {

        alert(
            "Maksimal 5000 karakter."
        );

        return;

    }


    const button =
        document.getElementById(
            "saveEditButton"
        );


    button.disabled =
        true;

    button.textContent =
        "Menyimpan...";


    try {

        const response =
            await fetch(
                "/api/notes/" +
                editId,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            userToken:
                                userToken,

                            title:
                                title ||
                                (
                                    editType ===
                                    "jurnal"
                                        ? "Jurnal Tanpa Judul"
                                        : "Tanpa Judul"
                                ),

                            content:
                                content

                        })

                }
            );


        const data =
            await bacaJSON(
                response
            );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Gagal menyimpan perubahan."
            );

        }


        alert(
            "Berhasil diperbarui."
        );


        tutupEditor();


        await tampilkanCatatan();


    } catch (error) {

        console.error(
            error
        );

        alert(
            error.message ||
            "Gagal menyimpan."
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "💾 Simpan";

    }

}


// =================================================
// TUTUP EDITOR
// =================================================

function tutupEditor() {

    document.getElementById(
        "editor"
    ).style.display =
        "none";


    document.getElementById(
        "editTitle"
    ).value =
        "";


    document.getElementById(
        "editContent"
    ).value =
        "";


    document.getElementById(
        "counter"
    ).textContent =
        "0";


    document.getElementById(
        "editorTitle"
    ).textContent =
        "✏️ Edit";


    editId =
        null;

    editType =
        null;

}


document.getElementById(
    "cancelEditButton"
).addEventListener(
    "click",
    tutupEditor
);


document.getElementById(
    "saveEditButton"
).addEventListener(
    "click",
    simpanEdit
);


// =================================================
// HAPUS
// =================================================

async function hapus(id) {

    const note =
        semuaNotes.find(
            n => n.id === id
        );


    const nama =
        note?.type === "jurnal"
            ? "jurnal"
            : "catatan";


    if (
        !confirm(
            `Hapus ${nama} ini?`
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/notes/" +
                id,
                {
                    method: "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            userToken:
                                userToken

                        })

                }
            );


        const data =
            await bacaJSON(
                response
            );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Gagal menghapus."
            );

        }


        alert(
            `${nama} berhasil dihapus.`
        );


        await tampilkanCatatan();


    } catch (error) {

        console.error(
            error
        );

        alert(
            error.message ||
            "Gagal menghapus."
        );

    }

}


// =================================================
// HEARTBEAT
// =================================================

async function heartbeat() {

    const token =
        getCookie(
            "notepadkita_user"
        );


    if (!token) {
        return;
    }


    try {

        await fetch(
            "/api/users/" +
            encodeURIComponent(
                token
            ) +
            "/heartbeat",
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.warn(
            "Heartbeat gagal:",
            error
        );

    }

}


function mulaiHeartbeat() {

    heartbeat();


    setInterval(
        heartbeat,
        20000
    );

}


// =================================================
// MULAI
// =================================================

async function mulai() {

    const siap =
        await siapkanUser();


    if (!siap) {

        document.getElementById(
            "catatanList"
        ).innerHTML = `
            <div class="error">
                Gagal menyiapkan pengguna.
            </div>
        `;


        document.getElementById(
            "jurnalList"
        ).innerHTML = `
            <div class="error">
                Gagal menyiapkan pengguna.
            </div>
        `;

        return;

    }


    await tampilkanCatatan();


    mulaiHeartbeat();

}


mulai();

</script>

</body>

</html>
